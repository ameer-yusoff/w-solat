name: Attach W-Solat v2.1.0 Windows installer
on:
  push:
    branches: [build/v2.1.0-windows-installer]
    paths: ['.github/workflows/build-windows-installer.yml']
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify release and attach the installer
        run: |
          set -euo pipefail
          tag_commit=$(gh api "repos/$GH_REPO/commits/v2.1.0" --jq .sha)
          test "$tag_commit" = 8f924f76a7a69d961225471984146818b5438b71
          gh run download 43807559105 --name W-Solat_2.1.0_x64-setup --dir installer
          file=installer/W-Solat_2.1.0_x64-setup.exe
          test -s "$file"
          sha256sum "$file"
          gh release upload v2.1.0 "$file"
          gh release view v2.1.0 --json assets --jq '.assets[].name'
